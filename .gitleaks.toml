title = "Cifra gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Fictitious local development values"
regexTarget = "match"
regexes = [
  '''cifra_local_development'''
]
paths = [
  '''\.env\.example$''',
  '''docker-compose\.yml$''',
  '''apps/api/app/core/settings\.py$'''
]
