[project]
name = "cifra-api"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
  "aioboto3>=15.5.0",
  "alembic>=1.16,<2",
  "argon2-cffi>=25.1,<26",
  "asyncpg>=0.31.0,<1",
  "cryptography>=46.0.7,<51",
  "email-validator>=2.2,<3",
  "fastapi>=0.135.0,<1",
  "httpx>=0.28.1,<1",
  "pydantic-settings>=2.13.0,<3",
  "pyjwt>=2.10,<3",
  "pyotp>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0.3,<7",
  "redis>=7.4.0,<8",
  "segno>=1.6,<2",
  "sqlalchemy[asyncio]>=2.0.44,<3",
  "uvicorn[standard]>=0.42.0,<1",
]

[dependency-groups]
dev = [
  "asyncpg-stubs==0.31.1",
  "hypothesis>=6.167.1",
  "mypy==1.19.1",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "ruff==0.16.5",
  "types-pyyaml>=6.0.12",
]

[[tool.mypy.overrides]]
module = ["aioboto3", "aiobotocore.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
