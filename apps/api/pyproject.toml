[project]
name = "cifra-api"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
  "asyncpg>=0.31.0,<1",
  "fastapi>=0.135.0,<1",
  "httpx>=0.28.1,<1",
  "pydantic-settings>=2.13.0,<3",
  "redis>=7.4.1,<8",
  "uvicorn[standard]>=0.42.0,<1"
]

[dependency-groups]
dev = [
  "asyncpg-stubs==0.31.1",
  "mypy==1.19.1",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "ruff==0.16.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false

[tool.coverage.xml]
output = "coverage.xml"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
