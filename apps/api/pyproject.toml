[project]
name = "cifra-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.31.0,<1",
  "fastapi>=0.135.0,<1",
  "httpx>=0.28.1,<1",
  "pydantic-settings>=2.13.0,<3",
  "redis>=7.4.0,<8",
  "uvicorn[standard]>=0.42.0,<1"
]

[dependency-groups]
dev = [
  "pytest>=9.0.2,<10",
  "pytest-asyncio>=1.3.0,<2",
  "ruff>=0.15.0,<1"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
