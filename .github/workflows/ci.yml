name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "11.24.0"
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.2"
          cache: pnpm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.6"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - name: install gitleaks 8.28.0
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o gitleaks.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
      - run: uv sync --frozen
        working-directory: apps/api
      - run: pnpm lint
      - run: pnpm lint:format
      - run: pnpm format:check
      - run: pnpm zero-comments
      - run: pnpm zero-comments:test
      - run: pnpm --filter @cifra/api openapi:check
      - run: pnpm run security:secrets:files
      - run: pnpm run security:secrets:history
      - run: pnpm typecheck

  test-api:
    name: Test API
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cifra
          POSTGRES_USER: cifra
          POSTGRES_PASSWORD: cifra_local_development
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cifra -d cifra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://cifra:cifra_local_development@localhost:5432/cifra
      REDIS_URL: redis://localhost:6379/15
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: generate ephemeral test secrets
        run: |
          echo "JWT_SIGNING_KEY=ci-$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "TOTP_ENCRYPTION_KEY=$(python3 -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "11.24.0"
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.2"
          cache: pnpm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.6"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: apps/api
      - name: apply migrations
        run: uv run alembic upgrade head
        working-directory: apps/api
      - run: pnpm --filter @cifra/api test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: api-coverage
          path: apps/api/coverage.xml
          retention-days: 14

  test-typescript:
    name: Test TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "11.24.0"
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.2"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cifra/web test
      - run: pnpm --filter @cifra/mobile test
      - run: pnpm --filter @cifra/api-client test

  build-and-expo:
    name: Build and Expo
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "11.24.0"
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.2"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @cifra/mobile exec expo install --check
      - run: pnpm --filter @cifra/mobile exec npx expo-doctor@1.20.4

  integration:
    name: Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker compose config -q
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - run: curl --fail http://localhost:18000/health/live
      - run: curl --fail http://localhost:18000/health/ready
      - run: curl --fail http://localhost:13000
      - name: apply migrations
        run: docker compose exec -T api uv run --no-sync alembic upgrade head
      - name: auth smoke test
        run: |
          set -euo pipefail
          EMAIL="smoke-$RANDOM@example.com"
          BODY='{"email":"'$EMAIL'","password":"CorrectHorse-9x!LongEnough","name":"Smoke"}'
          curl --fail -s -o /dev/null -w "register:%{http_code}\n" -X POST http://localhost:18000/auth/register -H 'Content-Type: application/json' -d "$BODY"
          LOGIN=$(curl --fail -s -X POST http://localhost:18000/auth/login -H 'Content-Type: application/json' -d '{"email":"'$EMAIL'","password":"CorrectHorse-9x!LongEnough"}')
          ACCESS=$(echo "$LOGIN" | python3 -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')
          REFRESH=$(echo "$LOGIN" | python3 -c 'import json,sys;print(json.load(sys.stdin)["refresh_token"])')
          curl --fail -s -o /dev/null -w "me:%{http_code}\n" http://localhost:18000/auth/me -H "Authorization: Bearer $ACCESS"
          NEW=$(curl --fail -s -X POST http://localhost:18000/auth/refresh -H 'Content-Type: application/json' -d '{"refresh_token":"'$REFRESH'"}')
          curl --fail -s -o /dev/null -w "replayed-refresh-rejected:%{http_code}\n" -X POST http://localhost:18000/auth/refresh -H 'Content-Type: application/json' -d '{"refresh_token":"'$REFRESH'"}' || test $? -eq 22
          LOGOUT_REFRESH=$(echo "$NEW" | python3 -c 'import json,sys;print(json.load(sys.stdin)["refresh_token"])')
          curl --fail -s -o /dev/null -w "logout:%{http_code}\n" -X POST http://localhost:18000/auth/logout -H 'Content-Type: application/json' -d '{"refresh_token":"'$LOGOUT_REFRESH'"}'
          curl -s -o /dev/null -w "token-reuse-rejected:%{http_code}\n" -X POST http://localhost:18000/auth/refresh -H 'Content-Type: application/json' -d '{"refresh_token":"'$LOGOUT_REFRESH'"}' && exit 1 || test $? -eq 22
      - if: always()
        run: docker compose down
