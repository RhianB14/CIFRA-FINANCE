      type: object
    VerifyTwoFactorResponse:
      additionalProperties: false
      properties:
        access_token:
          title: Access Token
          type: string
        backup_codes:
          items:
            type: string
          title: Backup Codes
          type: array
        refresh_token:
          title: Refresh Token
          type: string
      required:
      - access_token
      - refresh_token
      - backup_codes
      title: VerifyTwoFactorResponse
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: auth/login
      type: oauth2
info:
  title: Cifra API
  version: 0.2.0
openapi: 3.1.0
paths:
  /accounts:
    get:
      operationId: list_accounts_accounts_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AccountOut'
                title: Response List Accounts Accounts Get
                type: array
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: List Accounts
      tags:
      - accounts
    post:
      operationId: create_account_accounts_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Create Account
      tags:
      - accounts
  /accounts/{account_id}:
    delete:
      operationId: delete_account_accounts__account_id__delete
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          format: uuid
          title: Account Id
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Delete Account
      tags:
      - accounts
    get:
      operationId: get_account_accounts__account_id__get
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          format: uuid
          title: Account Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Get Account
      tags:
      - accounts
    patch:
      operationId: update_account_accounts__account_id__patch
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          format: uuid
          title: Account Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Update Account
      tags:
      - accounts
  /accounts/{account_id}/attachments:
    post:
      operationId: upload_attachment_accounts__account_id__attachments_post
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          format: uuid
          title: Account Id
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_attachment_accounts__account_id__attachments_post'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Upload Attachment
      tags:
      - accounts
  /accounts/{account_id}/attachments/{attachment_id}:
    get:
      operationId: download_attachment_accounts__account_id__attachments__attachment_id__get
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          format: uuid
          title: Account Id
          type: string
      - in: path
        name: attachment_id
        required: true
        schema:
          format: uuid
          title: Attachment Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Download Attachment
      tags:
      - accounts
  /accounts/{account_id}/balance:
    get:
      operationId: account_balance_accounts__account_id__balance_get
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          format: uuid
          title: Account Id
          type: string
      - in: query
        name: projected
        required: false
        schema:
          default: false
          title: Projected
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalanceOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Account Balance
      tags:
      - accounts
  /accounts/{account_id}/imports:
    post:
      operationId: import_account_csv_accounts__account_id__imports_post
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          format: uuid
          title: Account Id
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_import_account_csv_accounts__account_id__imports_post'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchOut'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Import Account Csv
      tags:
      - accounts
  /accounts/{account_id}/snapshots:
    get:
      operationId: list_snapshots_accounts__account_id__snapshots_get
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          format: uuid
          title: Account Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SnapshotOut'
                title: Response List Snapshots Accounts  Account Id  Snapshots Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: List Snapshots
      tags:
      - accounts
    post:
      operationId: create_snapshot_accounts__account_id__snapshots_post
      parameters:
      - in: path
        name: account_id
        required: true
        schema:
          format: uuid
          title: Account Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotCreate'
        required: true
