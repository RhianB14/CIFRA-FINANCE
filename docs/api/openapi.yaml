components:
  schemas:
    AccountBalanceOut:
      properties:
        account_id:
          title: Account Id
          type: string
        current_balance_cents:
          title: Current Balance Cents
          type: integer
        projected_balance_cents:
          title: Projected Balance Cents
          type: integer
      required:
      - account_id
      - current_balance_cents
      - projected_balance_cents
      title: AccountBalanceOut
      type: object
    AccountCreate:
      additionalProperties: false
      properties:
        currency:
          maxLength: 3
          minLength: 3
          title: Currency
          type: string
        initial_balance_cents:
          default: 0
          minimum: 0.0
          title: Initial Balance Cents
          type: integer
        kind:
          title: Kind
          type: string
        name:
          maxLength: 255
          minLength: 1
          title: Name
          type: string
      required:
      - name
      - kind
      - currency
      title: AccountCreate
      type: object
    AccountOut:
      properties:
        archived_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Archived At
        created_at:
          format: date-time
          title: Created At
          type: string
        currency:
          title: Currency
          type: string
        current_balance_cents:
          title: Current Balance Cents
          type: integer
        current_balance_version:
          title: Current Balance Version
          type: integer
        id:
          format: uuid
          title: Id
          type: string
        initial_balance_cents:
          title: Initial Balance Cents
          type: integer
        kind:
          title: Kind
          type: string
        name:
          title: Name
          type: string
      required:
      - id
      - name
      - kind
      - currency
      - initial_balance_cents
      - current_balance_cents
      - current_balance_version
      - archived_at
      - created_at
      title: AccountOut
      type: object
    AccountUpdate:
      additionalProperties: false
      properties:
        archived:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Archived
        expected_version:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Expected Version
        kind:
          anyOf:
          - type: string
          - type: 'null'
          title: Kind
        name:
          anyOf:
          - maxLength: 255
            minLength: 1
            type: string
          - type: 'null'
          title: Name
      title: AccountUpdate
      type: object
    AttachmentOut:
      properties:
        account_id:
          format: uuid
          title: Account Id
          type: string
        content_type:
          title: Content Type
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        file_name:
          title: File Name
          type: string
        id:
          format: uuid
          title: Id
          type: string
        size_bytes:
          title: Size Bytes
          type: integer
      required:
      - id
      - account_id
      - file_name
      - content_type
      - size_bytes
      - created_at
      title: AttachmentOut
      type: object
    Body_import_account_csv_accounts__account_id__imports_post:
      properties:
        file:
          contentMediaType: application/octet-stream
          title: File
          type: string
        source_name:
          title: Source Name
          type: string
      required:
      - file
      - source_name
      title: Body_import_account_csv_accounts__account_id__imports_post
      type: object
    Body_login_auth_login_post:
      properties:
        client_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Id
        client_secret:
          anyOf:
          - type: string
          - type: 'null'
          format: password
          title: Client Secret
        grant_type:
          anyOf:
          - pattern: ^password$
            type: string
          - type: 'null'
          title: Grant Type
        password:
          format: password
          title: Password
          type: string
        scope:
          default: ''
          title: Scope
          type: string
        username:
          title: Username
          type: string
      required:
      - username
      - password
      title: Body_login_auth_login_post
      type: object
    Body_upload_attachment_accounts__account_id__attachments_post:
      properties:
        file:
          contentMediaType: application/octet-stream
          title: File
          type: string
      required:
      - file
      title: Body_upload_attachment_accounts__account_id__attachments_post
      type: object
    CategoryCreate:
      additionalProperties: false
      properties:
        color:
          anyOf:
          - pattern: "^#[0-9A-Fa-f]{6}$"
            type: string
          - type: 'null'
          title: Color
        kind:
          title: Kind
          type: string
        name:
          maxLength: 120
          minLength: 1
          title: Name
          type: string
      required:
      - name
      - kind
      title: CategoryCreate
      type: object
    CategoryOut:
      properties:
        archived_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Archived At
        color:
          anyOf:
          - type: string
          - type: 'null'
          title: Color
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          format: uuid
          title: Id
          type: string
        kind:
          title: Kind
          type: string
        name:
          title: Name
          type: string
      required:
      - id
      - name
      - kind
      - color
      - archived_at
      - created_at
      title: CategoryOut
      type: object
    CategoryUpdate:
      additionalProperties: false
      properties:
        archived:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Archived
        color:
          anyOf:
          - pattern: "^#[0-9A-Fa-f]{6}$"
            type: string
          - type: 'null'
          title: Color
        kind:
          anyOf:
          - type: string
          - type: 'null'
          title: Kind
        name:
          anyOf:
          - maxLength: 120
            minLength: 1
            type: string
          - type: 'null'
          title: Name
      title: CategoryUpdate
      type: object
    ChallengeRequest:
      additionalProperties: false
      properties:
        challenge_id:
          title: Challenge Id
          type: string
        code:
          maxLength: 16
          minLength: 1
          title: Code
          type: string
      required:
      - challenge_id
      - code
      title: ChallengeRequest
      type: object
    ConfirmTwoFactorRequest:
      additionalProperties: false
      properties:
        code:
          maxLength: 16
          minLength: 6
          title: Code
          type: string
      required:
      - code
      title: ConfirmTwoFactorRequest
      type: object
    DisableTwoFactorRequest:
      additionalProperties: false
      properties:
        code:
          maxLength: 16
          minLength: 1
          title: Code
          type: string
        password:
          maxLength: 128
          minLength: 1
          title: Password
          type: string
      required:
      - password
      - code
      title: DisableTwoFactorRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    ImportBatchOut:
      properties:
        account_id:
          format: uuid
          title: Account Id
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        file_name:
          title: File Name
          type: string
        file_sha256:
          title: File Sha256
          type: string
        id:
          format: uuid
          title: Id
          type: string
        imported_count:
          title: Imported Count
          type: integer
        row_count:
          title: Row Count
          type: integer
        skipped_count:
          title: Skipped Count
          type: integer
        source_name:
          title: Source Name
          type: string
      required:
      - id
      - account_id
      - source_name
      - file_name
      - file_sha256
      - row_count
      - imported_count
      - skipped_count
      - created_at
      title: ImportBatchOut
      type: object
    MeResponse:
      additionalProperties: false
      properties:
        email:
          format: email
          title: Email
          type: string
        id:
          format: uuid
          title: Id
          type: string
        name:
          title: Name
          type: string
        totp_enabled:
          title: Totp Enabled
          type: boolean
      required:
      - id
      - email
      - name
      - totp_enabled
      title: MeResponse
      type: object
    PasswordRecoveryRequest:
      additionalProperties: false
      properties:
        email:
          format: email
          title: Email
          type: string
      required:
      - email
      title: PasswordRecoveryRequest
      type: object
    PasswordResetRequest:
      additionalProperties: false
      properties:
        new_password:
          maxLength: 128
          minLength: 1
          title: New Password
          type: string
        token:
          maxLength: 256
          minLength: 16
          title: Token
          type: string
      required:
      - token
      - new_password
      title: PasswordResetRequest
      type: object
    RefreshRequest:
      additionalProperties: false
      properties:
        refresh_token:
          title: Refresh Token
          type: string
      required:
      - refresh_token
      title: RefreshRequest
      type: object
    RegisterRequest:
      additionalProperties: false
      properties:
        email:
          format: email
          title: Email
          type: string
        name:
          maxLength: 255
          minLength: 1
          title: Name
          type: string
        password:
          maxLength: 128
          minLength: 1
          title: Password
          type: string
      required:
      - email
      - password
      - name
      title: RegisterRequest
      type: object
    ReversalCreate:
      additionalProperties: false
      properties:
        expected_version:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Expected Version
        idempotency_key:
          maxLength: 128
          minLength: 1
          title: Idempotency Key
          type: string
      required:
      - idempotency_key
      title: ReversalCreate
      type: object
    SetupTwoFactorResponse:
      additionalProperties: false
      properties:
        otpauth_uri:
          title: Otpauth Uri
          type: string
        qr_data_uri:
          title: Qr Data Uri
          type: string
      required:
      - otpauth_uri
      - qr_data_uri
      title: SetupTwoFactorResponse
      type: object
    SnapshotCreate:
      additionalProperties: false
      properties:
        note:
          anyOf:
          - maxLength: 500
            minLength: 1
            type: string
          - type: 'null'
          title: Note
        reported_balance_cents:
          title: Reported Balance Cents
          type: integer
      required:
      - reported_balance_cents
      title: SnapshotCreate
      type: object
    SnapshotOut:
      properties:
        account_id:
          format: uuid
          title: Account Id
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        difference_cents:
          title: Difference Cents
          type: integer
        id:
          format: uuid
          title: Id
          type: string
        ledger_balance_cents:
          title: Ledger Balance Cents
          type: integer
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        reported_balance_cents:
          title: Reported Balance Cents
          type: integer
        status:
          title: Status
          type: string
      required:
      - id
      - account_id
      - reported_balance_cents
      - ledger_balance_cents
      - difference_cents
      - status
      - note
      - created_at
      title: SnapshotOut
      type: object
    TagCreate:
      additionalProperties: false
      properties:
        name:
          maxLength: 60
          minLength: 1
          title: Name
          type: string
      required:
      - name
      title: TagCreate
      type: object
    TagOut:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          format: uuid
          title: Id
          type: string
        name:
          title: Name
          type: string
      required:
      - id
      - name
      - created_at
      title: TagOut
      type: object
    TokenPair:
      additionalProperties: false
      properties:
        access_token:
          title: Access Token
          type: string
        refresh_token:
          title: Refresh Token
          type: string
        token_type:
          default: bearer
          title: Token Type
          type: string
      required:
      - access_token
      - refresh_token
      title: TokenPair
      type: object
    TransactionCreate:
      additionalProperties: false
      properties:
        amount_cents:
          exclusiveMinimum: 0.0
          title: Amount Cents
          type: integer
        description:
          anyOf:
          - maxLength: 500
            minLength: 1
            type: string
          - type: 'null'
          title: Description
        external_id:
          anyOf:
          - maxLength: 255
            minLength: 1
            type: string
          - type: 'null'
          title: External Id
        fingerprint:
          anyOf:
          - maxLength: 255
            minLength: 1
            type: string
          - type: 'null'
          title: Fingerprint
        idempotency_key:
          maxLength: 128
          minLength: 1
          title: Idempotency Key
          type: string
        occurred_at:
          format: date-time
          title: Occurred At
          type: string
        operation_type:
          title: Operation Type
          type: string
      required:
      - idempotency_key
      - operation_type
      - amount_cents
      - occurred_at
      title: TransactionCreate
      type: object
    TransactionOut:
      properties:
        amount_cents:
          title: Amount Cents
          type: integer
        balance_after_cents:
          default: 0
          title: Balance After Cents
          type: integer
        balance_version:
          default: 0
          title: Balance Version
          type: integer
        category_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Category Id
        created_at:
          format: date-time
          title: Created At
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        external_id:
          anyOf:
          - type: string
          - type: 'null'
          title: External Id
        fingerprint:
          anyOf:
          - type: string
          - type: 'null'
          title: Fingerprint
        id:
          format: uuid
          title: Id
          type: string
        kind:
          title: Kind
          type: string
        occurred_at:
          format: date-time
          title: Occurred At
          type: string
        operation_type:
          title: Operation Type
          type: string
        reversal_of_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Reversal Of Id
        status:
          title: Status
          type: string
      required:
      - id
      - kind
      - operation_type
      - status
      - amount_cents
      - occurred_at
      - description
      - external_id
      - fingerprint
      - reversal_of_id
      - category_id
      - created_at
      title: TransactionOut
      type: object
    TransferCreate:
      additionalProperties: false
      properties:
        amount_cents:
          exclusiveMinimum: 0.0
          title: Amount Cents
          type: integer
        idempotency_key:
          maxLength: 128
          minLength: 1
          title: Idempotency Key
          type: string
        occurred_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Occurred At
        target_account_id:
          format: uuid
          title: Target Account Id
          type: string
      required:
      - idempotency_key
      - amount_cents
      - target_account_id
      title: TransferCreate
      type: object
    TwoFactorChallengeResponse:
      additionalProperties: false
      properties:
        challenge_id:
          title: Challenge Id
          type: string
        two_factor_required:
          default: true
          title: Two Factor Required
          type: boolean
      required:
      - challenge_id
      title: TwoFactorChallengeResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
